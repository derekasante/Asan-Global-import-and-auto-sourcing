<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Asan Global</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="design-system.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:var(--ag-font);
    min-height:100vh;
    background:linear-gradient(135deg,#071224 0%,#0f2440 45%,#1e4a82 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px;overflow:hidden;position:relative;
  }

  /* Animated background blobs */
  .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.18;pointer-events:none;}
  .blob-1{width:500px;height:500px;background:#2563eb;top:-120px;left:-120px;animation:blobDrift 10s ease-in-out infinite alternate;}
  .blob-2{width:360px;height:360px;background:#00b7ff;bottom:-80px;right:-60px;animation:blobDrift 13s ease-in-out infinite alternate-reverse;}
  .blob-3{width:240px;height:240px;background:#ffd54f;top:40%;left:55%;opacity:.10;animation:blobDrift 8s ease-in-out infinite alternate;}
  @keyframes blobDrift{from{transform:translateY(0) scale(1);}to{transform:translateY(-30px) scale(1.06);}}

  /* Dot grid overlay */
  .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:30px 30px;pointer-events:none;}

  .err-card{
    position:relative;z-index:1;
    background:rgba(255,255,255,.07);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.14);
    border-radius:28px;
    padding:60px 52px 52px;
    text-align:center;
    max-width:560px;
    width:100%;
    box-shadow:0 32px 80px rgba(0,0,0,.35);
    animation:cardIn .55s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}

  /* Big 404 number */
  .err-code{
    font-size:clamp(5rem,14vw,9rem);
    font-weight:800;
    line-height:1;
    background:linear-gradient(135deg,#fff 0%,#60a5fa 60%,#00d4ff 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:12px;
    letter-spacing:-4px;
  }

  .err-icon{
    width:72px;height:72px;border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#0f2440);
    border:2px solid rgba(255,255,255,.2);
    display:inline-grid;place-items:center;
    font-size:30px;color:#60a5fa;
    margin-bottom:22px;
    box-shadow:0 0 0 10px rgba(37,99,235,.14);
  }

  .err-title{font-size:clamp(1.4rem,3vw,2rem);font-weight:800;color:#fff;margin-bottom:10px;}
  .err-sub{font-size:15px;color:rgba(255,255,255,.62);line-height:1.7;margin-bottom:32px;max-width:400px;margin-left:auto;margin-right:auto;}

  /* Action buttons */
  .err-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:36px;}
  .err-btn-primary{
    display:inline-flex;align-items:center;gap:9px;
    padding:14px 26px;border-radius:999px;border:none;cursor:pointer;
    background:linear-gradient(135deg,#2563eb,#0f2440);
    color:#fff;font-family:var(--ag-font);font-size:14.5px;font-weight:700;
    text-decoration:none;
    box-shadow:0 10px 24px rgba(37,99,235,.35);
    transition:transform .18s,box-shadow .18s;
  }
  .err-btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(37,99,235,.45);}
  .err-btn-secondary{
    display:inline-flex;align-items:center;gap:9px;
    padding:14px 26px;border-radius:999px;cursor:pointer;
    background:rgba(255,255,255,.10);
    border:1.5px solid rgba(255,255,255,.22);
    color:rgba(255,255,255,.88);font-family:var(--ag-font);font-size:14.5px;font-weight:600;
    text-decoration:none;
    transition:background .18s,border-color .18s,transform .18s;
  }
  .err-btn-secondary:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);transform:translateY(-2px);}

  /* Quick links */
  .err-links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;}
  .err-link{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 16px;border-radius:999px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    color:rgba(255,255,255,.7);font-size:13px;font-weight:600;
    text-decoration:none;transition:all .18s;
  }
  .err-link:hover{background:rgba(37,99,235,.3);border-color:rgba(59,130,246,.5);color:#fff;}
  .err-link i{font-size:12px;color:#60a5fa;}

  /* Bottom brand */
  .err-brand{
    position:relative;z-index:1;
    margin-top:36px;display:flex;align-items:center;gap:12px;
    color:rgba(255,255,255,.4);font-size:13px;
  }
  .err-brand svg{opacity:.6;}
  .err-brand a{color:rgba(255,255,255,.4);text-decoration:none;transition:color .18s;}
  .err-brand a:hover{color:rgba(255,255,255,.8);}
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="dots"></div>

  <main class="err-card" role="main">
    <div class="err-icon" aria-hidden="true"><i class="fas fa-map-marker-slash"></i></div>
    <div class="err-code" aria-label="Error 404">404</div>
    <h1 class="err-title">Page Not Found</h1>
    <p class="err-sub">
      We couldn't locate the page you're looking for. It may have been moved,
      deleted, or the link might be incorrect.
    </p>

    <div class="err-actions">
      <a href="index.html" class="err-btn-primary">
        <i class="fas fa-home"></i> Back to Home
      </a>
      <button onclick="history.back()" class="err-btn-secondary">
        <i class="fas fa-arrow-left"></i> Go Back
      </button>
    </div>

    <nav aria-label="Helpful links">
      <div class="err-links">
        <a href="tracking.html"   class="err-link"><i class="fas fa-map-marker-alt"></i> Track Shipment</a>
        <a href="dashboard.html"  class="err-link"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="appliances.html" class="err-link"><i class="fas fa-blender"></i> Appliances</a>
        <a href="import.html"     class="err-link"><i class="fas fa-file-import"></i> New Import</a>
        <a href="index.html#contact" class="err-link"><i class="fas fa-headset"></i> Contact Us</a>
      </div>
    </nav>
  </main>

  <footer class="err-brand">
    <svg width="24" height="24" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="48" height="48" rx="10" fill="#2563eb" opacity=".5"/>
      <path d="M8 30h32v3a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2v-3z" fill="#fff" opacity=".8"/>
      <path d="M10 30l4-9h20l4 9H10z" fill="#fff" opacity=".8"/>
      <path d="M16 21l3-5h10l3 5H16z" fill="#00d4ff" opacity=".9"/>
      <circle cx="15" cy="31" r="4" fill="#0f2440"/><circle cx="15" cy="31" r="2" fill="#00d4ff"/>
      <circle cx="33" cy="31" r="4" fill="#0f2440"/><circle cx="33" cy="31" r="2" fill="#00d4ff"/>
    </svg>
    <span>© 2026 <a href="index.html">Asan Global</a> · Import &amp; Auto Sourcing</span>
  </footer>
</body>
</html>
