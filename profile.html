<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asan Global | User Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="design-system.css">
<style>
.prof-topbar {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  background: rgba(255,255,255,0.96); backdrop-filter: blur(10px);
  padding: 18px 28px; border-bottom: 1px solid var(--ag-border);
  box-shadow: var(--ag-shadow-sm); position: sticky; top: 0; z-index: 900;
}
.prof-topbar .title-group { display: flex; align-items: center; gap: 14px; }
.prof-topbar h1 { margin: 0; font-size: 22px; color: var(--ag-text-900); }
.prof-topbar .eyebrow { color: var(--ag-blue-600); text-transform: uppercase; letter-spacing: 0.14em; font-size: 11px; font-weight: 700; margin: 0 0 2px; }
.ag-avatar-lg { width: 90px; height: 90px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--ag-blue-600), var(--ag-navy-800)); color: #fff; font-weight: 700; font-size: 36px; flex-shrink: 0; box-shadow: var(--ag-shadow-md); }
.ag-avatar-sm { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--ag-blue-600), var(--ag-navy-800)); color: #fff; font-weight: 700; font-size: 16px; }

.prof-content { padding: 28px; max-width: 1100px; margin: 0 auto; }

.prof-header-card {
  display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
  margin-bottom: 24px;
}
.prof-header-info h2 { font-size: 26px; color: var(--ag-text-900); margin: 0 0 8px; }
.prof-stats { display: flex; gap: 28px; margin-top: 16px; flex-wrap: wrap; }
.prof-stat-item h3 { font-size: 24px; font-weight: 700; color: var(--ag-text-900); margin: 0 0 2px; }
.prof-stat-item p { font-size: 13px; color: var(--ag-text-600); margin: 0; }

.import-history-card {
  background: var(--ag-surface); border: 1px solid var(--ag-border);
  border-radius: var(--ag-radius-md); padding: var(--ag-space-5);
  border-left: 4px solid var(--ag-blue-600);
  box-shadow: var(--ag-shadow-sm); margin-bottom: 16px;
  transition: transform var(--ag-transition), box-shadow var(--ag-transition);
}
.import-history-card:hover { transform: translateX(4px); box-shadow: var(--ag-shadow-md); }
.import-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
.tracking-id { font-size: 16px; font-weight: 700; color: var(--ag-navy-800); }
.import-card-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 14px; }
.detail-item label { display: block; font-size: 11.5px; font-weight: 600; color: var(--ag-text-400); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
.detail-item span { font-size: 14px; color: var(--ag-text-900); font-weight: 500; }
.import-card-actions { border-top: 1px solid var(--ag-border); padding-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }

.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.panel-head h4 { margin: 0; font-size: 16px; color: var(--ag-text-900); }

@media (max-width: 700px) {
  .prof-header-card { flex-direction: column; text-align: center; }
  .prof-stats { justify-content: center; }
  .prof-content { padding: 16px; }
  .import-card-details { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 480px) { .import-card-details { grid-template-columns: 1fr; } }
</style>
</head>
<body data-ag-page="profile">
<div class="ag-app-shell">
  <div id="ag-sidebar-mount"></div>
  <div class="ag-sidebar-backdrop" id="ag-sidebar-backdrop"></div>

  <main class="ag-main">
    <header class="prof-topbar">
      <div class="title-group">
        <button class="ag-hamburger" data-ag-sidebar-toggle aria-label="Open menu"><i class="fas fa-bars"></i></button>
        <div>
          <p class="eyebrow">Account overview</p>
          <h1>My Profile</h1>
        </div>
      </div>
      <div class="ag-avatar-sm" id="topbarAvatar">U</div>
    </header>

    <div class="prof-content">
      <!-- Profile Header Card -->
      <section class="ag-card ag-reveal" style="margin-bottom:24px;">
        <div class="prof-header-card">
          <div class="ag-avatar-lg" id="profileAvatar">U</div>
          <div class="prof-header-info">
            <h2 id="profileName">User Name</h2>
            <span class="ag-badge ag-badge-info" id="profileRole">Customer</span>
            <div class="prof-stats">
              <div class="prof-stat-item">
                <h3 id="totalImports">0</h3>
                <p>Total Imports</p>
              </div>
              <div class="prof-stat-item">
                <h3 id="completedImports">0</h3>
                <p>Completed</p>
              </div>
              <div class="prof-stat-item">
                <h3 id="inProgressImports">0</h3>
                <p>In Progress</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Import History -->
      <section class="ag-card ag-reveal">
        <div class="panel-head">
          <h4>Import History</h4>
          <a href="import.html" class="ag-btn ag-btn-primary" style="font-size:13px; padding:9px 16px;"><i class="fas fa-plus"></i> New Import</a>
        </div>
        <div id="importHistory"></div>
      </section>
    </div>

    <footer style="text-align:center; padding: 20px; color: var(--ag-text-400); font-size: 12.5px;">
      © 2026 Asan Global Vehicle Import Services
    </footer>
  </main>
</div>

<script src="sidebar.js"></script>
<script>
function checkAuth() {
  const user = JSON.parse(localStorage.getItem('asan_current_user'));
  if (!user) { window.location.href = 'login.html'; return false; }
  return user;
}

function getStatusBadge(status) {
  const m = {
    'Pending': 'ag-badge-neutral',
    'Documentation': 'ag-badge-info',
    'Processing': 'ag-badge-info',
    'In Transit': 'ag-badge-warning',
    'Customs Clearance': 'ag-badge-warning',
    'Delivered': 'ag-badge-success'
  };
  return m[status] || 'ag-badge-neutral';
}

function loadProfileData() {
  const user = checkAuth();
  if (!user) return;

  const initial = (user.name || 'U').charAt(0).toUpperCase();
  document.getElementById('profileName').textContent = user.name || 'User Name';
  document.getElementById('profileRole').textContent = user.role || 'Customer';
  document.getElementById('profileAvatar').textContent = initial;
  document.getElementById('topbarAvatar').textContent = initial;

  const imports = JSON.parse(localStorage.getItem('asan_imports') || '[]');
  const userImports = user.role === 'admin' ? imports : imports.filter(imp => imp.customer === user.name);

  document.getElementById('totalImports').textContent     = userImports.length;
  document.getElementById('completedImports').textContent = userImports.filter(i => i.status === 'Delivered').length;
  document.getElementById('inProgressImports').textContent= userImports.filter(i => i.status !== 'Delivered').length;

  const historyContainer = document.getElementById('importHistory');

  if (userImports.length === 0) {
    historyContainer.innerHTML = `
      <div class="ag-empty">
        <i class="fas fa-inbox"></i>
        <h4>No Import History</h4>
        <p>You haven't started any vehicle imports yet.</p>
        <a href="import.html" class="ag-btn ag-btn-primary" style="margin-top:12px;"><i class="fas fa-plus"></i> Start Your First Import</a>
      </div>`;
  } else {
    historyContainer.innerHTML = userImports.map(imp => {
      const badgeClass = getStatusBadge(imp.status);
      const totalCost = parseFloat(imp.importFee || 0) + parseFloat(imp.customsFee || 0);
      return `<div class="import-history-card">
        <div class="import-card-header">
          <span class="tracking-id"><i class="fas fa-hashtag ag-icon-brand" style="font-size:14px; margin-right:4px;"></i>${imp.tracking}</span>
          <span class="ag-badge ${badgeClass}">${imp.status}</span>
        </div>
        <div class="import-card-details">
          <div class="detail-item"><label>Vehicle</label><span>${imp.make} ${imp.model} ${imp.year}</span></div>
          <div class="detail-item"><label>Origin</label><span>${imp.origin}</span></div>
          <div class="detail-item"><label>Destination</label><span>${imp.destination}</span></div>
          <div class="detail-item"><label>Assigned Staff</label><span>${imp.assignedStaff || 'Unassigned'}</span></div>
          <div class="detail-item"><label>Vehicle Value</label><span>$${parseFloat(imp.value || 0).toLocaleString()}</span></div>
          <div class="detail-item"><label>Total Cost</label><span>$${totalCost.toLocaleString()}</span></div>
        </div>
        <div class="import-card-actions">
          <a href="tracking.html?tracking=${imp.tracking}" class="ag-btn ag-btn-primary" style="font-size:13px; padding:9px 16px;"><i class="fas fa-map-marker-alt"></i> Track Import</a>
        </div>
      </div>`;
    }).join('');
  }
}

function logout() {
  localStorage.removeItem('asan_current_user');
  window.location.href = 'login.html';
}

window.addEventListener('storage', function(e) {
  if (e.key === 'asan_imports') loadProfileData();
});

document.addEventListener('DOMContentLoaded', loadProfileData);
setInterval(loadProfileData, 30000);
</script>
</body>
</html>
