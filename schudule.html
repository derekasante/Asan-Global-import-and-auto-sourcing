<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asan Global | Import Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="design-system.css">
<style>
.sch-topbar {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  background: rgba(255,255,255,0.96); backdrop-filter: blur(10px);
  padding: 18px 28px; border-bottom: 1px solid var(--ag-border);
  box-shadow: var(--ag-shadow-sm); position: sticky; top: 0; z-index: 900;
}
.sch-topbar .title-group { display: flex; align-items: center; gap: 14px; }
.sch-topbar h1 { margin: 0; font-size: 22px; color: var(--ag-text-900); }
.sch-topbar .eyebrow { color: var(--ag-blue-600); text-transform: uppercase; letter-spacing: 0.14em; font-size: 11px; font-weight: 700; margin: 0 0 2px; }
.sch-topbar-actions { display: flex; align-items: center; gap: 14px; }
.ag-avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--ag-blue-600), var(--ag-navy-800)); color: #fff; font-weight: 700; font-size: 16px; }

.sch-content { padding: 28px; max-width: 1400px; margin: 0 auto; }
.sch-grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 18px; margin-bottom: 24px; }
.sch-stat-num { font-size: 32px; font-weight: 700; margin: 0 0 4px; color: var(--ag-text-900); }
.sch-stat-lbl { margin: 0; color: var(--ag-text-600); font-size: 13.5px; }

.sch-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 24px; }
.sch-import-card {
  background: var(--ag-surface); border: 1px solid var(--ag-border);
  border-radius: var(--ag-radius-md); padding: var(--ag-space-6);
  border-left: 4px solid var(--ag-blue-600);
  box-shadow: var(--ag-shadow-sm);
  transition: transform var(--ag-transition), box-shadow var(--ag-transition);
}
.sch-import-card:hover { transform: translateY(-3px); box-shadow: var(--ag-shadow-md); }
.sch-import-card .date-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--ag-blue-100); color: var(--ag-blue-600);
  border-radius: var(--ag-radius-pill); padding: 5px 12px;
  font-size: 12px; font-weight: 600; margin-bottom: 12px;
}
.sch-import-card h3 { font-size: 18px; color: var(--ag-text-900); margin: 0 0 10px; }
.sch-import-card .vehicle-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ag-text-600); margin-bottom: 8px; }
.sch-import-card .vehicle-row i { color: var(--ag-blue-600); width: 16px; }
.sch-import-card .route-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ag-text-600); margin-bottom: 12px; }
.sch-import-card .route-row i { color: var(--ag-blue-600); width: 16px; }

.sch-timeline-item {
  display: flex; gap: 20px; padding: 20px 0;
  border-bottom: 1px solid var(--ag-border);
  transition: background var(--ag-transition-fast);
}
.sch-timeline-item:last-child { border-bottom: none; }
.sch-timeline-item:hover { background: var(--ag-surface-muted); border-radius: var(--ag-radius-sm); }
.sch-timeline-time { width: 110px; font-weight: 600; color: var(--ag-blue-600); font-size: 13.5px; flex-shrink: 0; }
.sch-timeline-body { flex: 1; }
.sch-timeline-body h4 { font-size: 15px; color: var(--ag-text-900); margin: 0 0 4px; font-weight: 600; }
.sch-timeline-body p { font-size: 13px; color: var(--ag-text-600); margin: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.panel-head h4 { margin: 0; font-size: 16px; color: var(--ag-text-900); }

@media (max-width: 1100px) { .sch-grid-4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px)  { .sch-grid-4 { grid-template-columns: 1fr; } .sch-content { padding: 16px; } .sch-cards-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body data-ag-page="schedule">
<div class="ag-app-shell">
  <div id="ag-sidebar-mount"></div>
  <div class="ag-sidebar-backdrop" id="ag-sidebar-backdrop"></div>

  <main class="ag-main">
    <header class="sch-topbar">
      <div class="title-group">
        <button class="ag-hamburger" data-ag-sidebar-toggle aria-label="Open menu"><i class="fas fa-bars"></i></button>
        <div>
          <p class="eyebrow">Import timeline &amp; status</p>
          <h1>Import Schedule</h1>
        </div>
      </div>
      <div class="sch-topbar-actions">
        <div class="ag-avatar" id="userAvatar">U</div>
      </div>
    </header>

    <div class="sch-content">
      <section class="sch-grid-4 ag-reveal">
        <article class="ag-card ag-card--interactive">
          <p class="sch-stat-num" id="totalImports">0</p>
          <p class="sch-stat-lbl"><i class="fas fa-car ag-icon-brand"></i> Total Imports</p>
        </article>
        <article class="ag-card ag-card--interactive">
          <p class="sch-stat-num" id="inProgress">0</p>
          <p class="sch-stat-lbl"><i class="fas fa-spinner ag-icon-brand"></i> In Progress</p>
        </article>
        <article class="ag-card ag-card--interactive">
          <p class="sch-stat-num" id="completed">0</p>
          <p class="sch-stat-lbl"><i class="fas fa-check-circle" style="color:var(--ag-success);"></i> Completed</p>
        </article>
        <article class="ag-card ag-card--interactive">
          <p class="sch-stat-num" id="thisWeek">0</p>
          <p class="sch-stat-lbl"><i class="fas fa-calendar-week ag-icon-brand"></i> This Week</p>
        </article>
      </section>

      <section class="ag-reveal" id="scheduleGrid" style="margin-bottom:24px;">
        <!-- populated by JS -->
      </section>

      <section class="ag-card ag-reveal">
        <div class="panel-head">
          <h4>Import Timeline</h4>
          <span class="ag-badge ag-badge-info">Live</span>
        </div>
        <div id="timelineContainer"></div>
      </section>
    </div>

    <footer style="text-align:center; padding: 20px; color: var(--ag-text-400); font-size: 12.5px;">
      © 2026 Asan Global Vehicle Import Services
    </footer>
  </main>
</div>

<script src="sidebar.js"></script>
<script>
function checkAuth() {
  const user = JSON.parse(localStorage.getItem('asan_current_user'));
  if (!user) { window.location.href = 'login.html'; return false; }
  return user;
}

function statusBadgeClass(status) {
  const m = {
    'Pending': 'ag-badge-neutral',
    'Documentation': 'ag-badge-info',
    'Processing': 'ag-badge-info',
    'In Transit': 'ag-badge-warning',
    'Customs Clearance': 'ag-badge-warning',
    'Delivered': 'ag-badge-success'
  };
  return m[status] || 'ag-badge-neutral';
}

function loadScheduleData() {
  const user = checkAuth();
  if (!user) return;

  document.getElementById('userAvatar').textContent = (user.name || 'U').charAt(0).toUpperCase();

  const imports = JSON.parse(localStorage.getItem('asan_imports') || '[]');
  const userImports = user.role === 'admin' ? imports : imports.filter(imp => imp.customer === user.name);

  document.getElementById('totalImports').textContent = userImports.length;
  document.getElementById('inProgress').textContent   = userImports.filter(i => i.status !== 'Delivered').length;
  document.getElementById('completed').textContent    = userImports.filter(i => i.status === 'Delivered').length;
  document.getElementById('thisWeek').textContent     = userImports.length;

  const grid = document.getElementById('scheduleGrid');
  if (userImports.length === 0) {
    grid.innerHTML = `<div class="ag-empty"><i class="fas fa-calendar-times"></i><h4>No Scheduled Imports</h4><p>Start your first import to see it here.</p></div>`;
  } else {
    const cards = userImports.slice(0, 6).map(imp => {
      const badgeClass = statusBadgeClass(imp.status);
      return `<div class="sch-import-card">
        <span class="date-pill"><i class="fas fa-calendar-day"></i>${new Date().toLocaleDateString()}</span>
        <h3>${imp.make} ${imp.model}</h3>
        <div class="vehicle-row"><i class="fas fa-car"></i><span>${imp.year} &bull; ${imp.vin}</span></div>
        <div class="route-row"><i class="fas fa-map-marker-alt"></i><span>${imp.origin} &rarr; ${imp.destination}</span></div>
        <span class="ag-badge ${badgeClass}">${imp.status}</span>
      </div>`;
    }).join('');
    grid.innerHTML = `<div class="sch-cards-grid">${cards}</div>`;
  }

  const timeline = document.getElementById('timelineContainer');
  if (userImports.length === 0) {
    timeline.innerHTML = `<div class="ag-empty"><i class="fas fa-clock"></i>No timeline events.</div>`;
  } else {
    timeline.innerHTML = userImports.slice(0, 5).map(imp => {
      const badgeClass = statusBadgeClass(imp.status);
      return `<div class="sch-timeline-item">
        <div class="sch-timeline-time">Today</div>
        <div class="sch-timeline-body">
          <h4>${imp.tracking} — ${imp.make} ${imp.model}</h4>
          <p>${imp.origin} to ${imp.destination}</p>
        </div>
        <span class="ag-badge ${badgeClass}">${imp.status}</span>
      </div>`;
    }).join('');
  }
}

function logout() {
  localStorage.removeItem('asan_current_user');
  window.location.href = 'login.html';
}

window.addEventListener('storage', function(e) {
  if (e.key === 'asan_imports') loadScheduleData();
});

document.addEventListener('DOMContentLoaded', loadScheduleData);
setInterval(loadScheduleData, 30000);
</script>
</body>
</html>
