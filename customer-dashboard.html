<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard | Asan Global</title>
<meta name="description" content="Track your imports, view shipment status and manage your Asan Global profile.">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="design-system.css">
<style>
  .cust-topbar {
    display:flex; justify-content:space-between; align-items:center; gap:16px;
    background:#fff; padding:0 28px; border-bottom:1px solid var(--ag-border);
    position:sticky; top:0; z-index:900; height:66px; box-shadow:0 1px 3px rgba(15,23,42,.06);
  }
  .cust-topbar-left { display:flex; align-items:center; gap:14px; }
  .cust-topbar h1 { margin:0; font-size:20px; font-weight:700; color:var(--ag-text-900); }
  .cust-eyebrow { font-size:10.5px; font-weight:700; color:var(--ag-blue-600); text-transform:uppercase; letter-spacing:.14em; margin:0 0 1px; }
  .cust-topbar-right { display:flex; align-items:center; gap:12px; }
  .cust-name-chip { display:flex; align-items:center; gap:10px; background:var(--ag-surface-muted); border:1px solid var(--ag-border); border-radius:var(--ag-radius-pill); padding:6px 14px 6px 8px; }
  .cust-name-chip .avatar { width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--ag-blue-600),var(--ag-navy-700)); color:#fff; font-size:13px; font-weight:700; display:grid; place-items:center; }
  .cust-name-chip .name { font-size:13px; font-weight:700; color:var(--ag-text-900); }
  .cust-name-chip .badge { font-size:10px; font-weight:700; background:#dbeafe; color:#1e40af; padding:2px 7px; border-radius:999px; }

  .cust-content { padding:28px; max-width:1180px; margin:0 auto; }

  .cust-hero {
    background:linear-gradient(135deg,var(--ag-navy-950) 0%,var(--ag-navy-800) 45%,var(--ag-blue-600) 100%);
    border-radius:var(--ag-radius-lg); padding:28px 32px; margin-bottom:22px; position:relative; overflow:hidden; box-shadow:var(--ag-shadow-lg);
  }
  .cust-hero::before { content:''; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px); background-size:28px 28px; }
  .cust-hero-body { position:relative; z-index:1; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .cust-hero-avatar { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,var(--ag-gold-400),#ffd54f); color:var(--ag-navy-900); font-weight:800; font-size:26px; display:grid; place-items:center; flex-shrink:0; }
  .cust-hero h2 { color:#fff; font-size:22px; font-weight:800; margin:0 0 4px; }
  .cust-hero p { color:rgba(255,255,255,.7); font-size:13.5px; margin:0; }
  .cust-hero-meta { margin-left:auto; display:flex; gap:12px; flex-wrap:wrap; }
  .cust-hero-stat { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); border-radius:var(--ag-radius-md); padding:10px 16px; text-align:center; min-width:96px; }
  .cust-hero-stat strong { display:block; font-size:1.3rem; font-weight:800; color:#fff; line-height:1; }
  .cust-hero-stat span { font-size:11px; color:rgba(255,255,255,.6); display:block; margin-top:2px; }

  .cust-kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:22px; }
  .cust-kpi { background:#fff; border:1px solid var(--ag-border); border-radius:var(--ag-radius-lg); padding:18px 16px; box-shadow:var(--ag-shadow-sm); position:relative; overflow:hidden; }
  .cust-kpi::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; }
  .cust-kpi.blue::after { background:linear-gradient(90deg,#2563eb,#00d4ff); }
  .cust-kpi.green::after { background:linear-gradient(90deg,#16a34a,#4ade80); }
  .cust-kpi.amber::after { background:linear-gradient(90deg,#f59e0b,#fcd34d); }
  .cust-kpi.rose::after { background:linear-gradient(90deg,#e11d48,#fb7185); }
  .cust-kpi-icon { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; font-size:16px; color:#fff; margin-bottom:12px; }
  .cust-kpi-icon.blue { background:linear-gradient(135deg,#2563eb,#1e4a82); }
  .cust-kpi-icon.green { background:linear-gradient(135deg,#16a34a,#15803d); }
  .cust-kpi-icon.amber { background:linear-gradient(135deg,#f59e0b,#d97706); }
  .cust-kpi-icon.rose { background:linear-gradient(135deg,#e11d48,#be123c); }
  .cust-kpi-val { font-size:24px; font-weight:800; color:var(--ag-text-900); line-height:1; margin-bottom:3px; }
  .cust-kpi-label { font-size:11.5px; color:var(--ag-text-600); font-weight:500; }

  .cust-card { background:#fff; border:1px solid var(--ag-border); border-radius:var(--ag-radius-lg); box-shadow:var(--ag-shadow-sm); overflow:hidden; margin-bottom:22px; }
  .cust-card-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 22px 14px; border-bottom:1px solid var(--ag-border); flex-wrap:wrap; }
  .cust-card-head h3 { margin:0; font-size:15px; font-weight:700; color:var(--ag-text-900); }
  .cust-card-head h3 i { margin-right:8px; color:var(--ag-blue-600); }
  .cust-card-body { padding:18px 22px; }

  .cust-ship-item { display:flex; align-items:flex-start; gap:14px; padding:14px 0; border-bottom:1px solid var(--ag-surface-muted); }
  .cust-ship-item:last-child { border-bottom:none; }
  .cust-ship-icon { width:40px; height:40px; border-radius:10px; background:linear-gradient(135deg,var(--ag-blue-600),var(--ag-navy-700)); color:#fff; display:grid; place-items:center; font-size:15px; flex-shrink:0; }
  .cust-ship-body { flex:1; min-width:0; }
  .cust-ship-body h5 { margin:0 0 3px; font-size:14px; color:var(--ag-text-900); }
  .cust-ship-body p { margin:0; font-size:12.5px; color:var(--ag-text-600); line-height:1.5; }
  .cust-ship-meta { font-size:11px; color:var(--ag-text-400); margin-top:4px; display:flex; gap:10px; flex-wrap:wrap; }
  .cust-ship-actions { display:flex; gap:6px; flex-shrink:0; }
  .cust-ship-actions .btn {
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:var(--ag-radius-sm);
    font-family:var(--ag-font); font-size:12.5px; font-weight:600; cursor:pointer; text-decoration:none;
    background:var(--ag-blue-600); color:#fff; border:none; transition:background .18s, transform .18s;
  }
  .cust-ship-actions .btn:hover { background:var(--ag-navy-700); transform:translateY(-1px); }

  .st-badge { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; }
  .st-badge .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
  .st-pending { background:#fef3c7; color:#92400e; }
  .st-processing { background:#dbeafe; color:#1e40af; }
  .st-transit { background:#fef3c7; color:#b45309; }
  .st-customs { background:#fce7f3; color:#be185d; }
  .st-arrived { background:#cffafe; color:#0e7490; }
  .st-delivered { background:#dcfce7; color:#15803d; }

  .cust-empty { text-align:center; padding:40px 20px; color:var(--ag-text-400); }
  .cust-empty i { font-size:34px; margin-bottom:12px; color:var(--ag-blue-200); }
  .cust-empty p { font-size:14px; margin:0 0 6px; color:var(--ag-text-600); }

  .cust-note { display:flex; align-items:flex-start; gap:10px; background:var(--ag-info-bg); color:var(--ag-info); border:1px solid rgba(29,78,216,.2); border-radius:var(--ag-radius-md); padding:11px 16px; font-size:12.5px; line-height:1.5; margin-bottom:16px; }
  .cust-note i { margin-top:2px; }

  .cust-profile-row { display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--ag-surface-muted); font-size:13px; }
  .cust-profile-row:last-child { border-bottom:none; }
  .cust-profile-row .lbl { color:var(--ag-text-400); font-weight:500; }
  .cust-profile-row .val { color:var(--ag-text-900); font-weight:600; text-align:right; word-break:break-word; }

  @media (max-width:900px){ .cust-kpi-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:700px){ .cust-content{ padding:14px; } .cust-kpi-grid{ grid-template-columns:repeat(2,1fr); } .cust-hero-meta{ margin-left:0; } }
  @media (max-width:480px){ .cust-kpi-grid{ grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<div class="ag-app-shell">
  <div id="ag-sidebar-mount"></div>
  <div class="ag-sidebar-backdrop" id="ag-sidebar-backdrop"></div>

  <main class="ag-main">
    <header class="cust-topbar">
      <div class="cust-topbar-left">
        <button class="ag-hamburger" data-ag-sidebar-toggle aria-label="Open menu"><i class="fas fa-bars"></i></button>
        <div>
          <p class="cust-eyebrow">Customer Portal</p>
          <h1><i class="fas fa-user" style="color:var(--ag-blue-600);margin-right:8px;"></i>My Dashboard</h1>
        </div>
      </div>
      <div class="cust-topbar-right">
        <div class="cust-name-chip">
          <div class="avatar" id="custAvatar">U</div>
          <div>
            <div class="name" id="custName">User</div>
            <div class="badge">CUSTOMER</div>
          </div>
        </div>
        <button class="ag-btn ag-btn-danger" onclick="logout()" style="font-size:13px;padding:9px 16px;">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </header>

    <div class="cust-content">
      <!-- HERO -->
      <section class="cust-hero">
        <div class="cust-hero-body">
          <div class="cust-hero-avatar" id="heroAvatar">U</div>
          <div>
            <h2 id="heroName">Welcome back</h2>
            <p id="heroEmail">Your import dashboard</p>
          </div>
          <div class="cust-hero-meta">
            <div class="cust-hero-stat"><strong id="heroTotal">0</strong><span>Shipments</span></div>
            <div class="cust-hero-stat"><strong id="heroInTransit">0</strong><span>In Transit</span></div>
            <div class="cust-hero-stat"><strong id="heroDelivered">0</strong><span>Delivered</span></div>
          </div>
        </div>
      </section>

      <!-- KPI -->
      <section class="cust-kpi-grid">
        <div class="cust-kpi blue"><div class="cust-kpi-icon blue"><i class="fas fa-ship"></i></div><div class="cust-kpi-val" id="kpiTotal">0</div><div class="cust-kpi-label">Total Shipments</div></div>
        <div class="cust-kpi amber"><div class="cust-kpi-icon amber"><i class="fas fa-route"></i></div><div class="cust-kpi-val" id="kpiTransit">0</div><div class="cust-kpi-label">In Transit</div></div>
        <div class="cust-kpi green"><div class="cust-kpi-icon green"><i class="fas fa-circle-check"></i></div><div class="cust-kpi-val" id="kpiDelivered">0</div><div class="cust-kpi-label">Delivered</div></div>
        <div class="cust-kpi rose"><div class="cust-kpi-icon rose"><i class="fas fa-clock-rotate-left"></i></div><div class="cust-kpi-val" id="kpiPending">0</div><div class="cust-kpi-label">In Progress</div></div>
      </section>

      <!-- SHIPMENTS -->
      <section class="cust-card">
        <div class="cust-card-head">
          <h3><i class="fas fa-box"></i>My Shipments</h3>
          <a href="import.html" class="ag-btn ag-btn-primary" style="font-size:12.5px;padding:8px 14px;"><i class="fas fa-plus"></i> New Import</a>
        </div>
        <div class="cust-card-body" style="padding-top:10px;">
          <div class="cust-note" id="shipmentsNote" style="display:none;">
            <i class="fas fa-info-circle"></i>
            <div><strong>Data source:</strong> <span id="shipmentsSourceText"></span></div>
          </div>
          <div id="shipmentsList"></div>
        </div>
      </section>

      <!-- PROFILE -->
      <section class="cust-card">
        <div class="cust-card-head">
          <h3><i class="fas fa-id-card"></i>My Profile</h3>
          <a href="profile.html" class="ag-btn ag-btn-secondary" style="font-size:12.5px;padding:8px 14px;">Edit Profile</a>
        </div>
        <div class="cust-card-body" id="profileBody"></div>
      </section>
    </div>

    <footer style="text-align:center;padding:20px;color:var(--ag-text-400);font-size:12px;">
      © 2026 Asan Global Import Services — Customer Dashboard
    </footer>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="sidebar.js"></script>
<script src="security-utils.js"></script>
<script>
(function () {
  'use strict';
  const esc = v => window.securityUtils?.escapeHtml ? window.securityUtils.escapeHtml(v) : String(v ?? '');

  const STATUS_CSS = {
    'Pending':'st-pending','Payment Confirmed':'st-processing','Processing':'st-processing',
    'Purchased':'st-processing','Packed':'st-processing','Ready for Shipment':'st-processing',
    'Shipped':'st-processing','In Transit':'st-transit','Customs Clearance':'st-customs',
    'Arrived in Ghana':'st-arrived','Out for Delivery':'st-arrived','Delivered':'st-delivered',
    'pending':'st-pending','confirmed':'st-processing','picked_up':'st-processing','in_transit':'st-transit',
    'customs_clearance':'st-customs','out_for_delivery':'st-arrived','delivered':'st-delivered','cancelled':'st-pending'
  };

  function statusBadge(status) {
    const s = status || 'Pending';
    const cls = STATUS_CSS[s] || 'st-pending';
    return `<span class="st-badge ${cls}"><span class="dot"></span>${esc(s)}</span>`;
  }

  function fmtDate(v) {
    if (!v) return '—';
    const d = new Date(v);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  }

  function timeAgo(iso) {
    if (!iso) return '';
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s/60) + ' min ago';
    if (s < 86400) return Math.floor(s/3600) + ' hr ago';
    return Math.floor(s/86400) + 'd ago';
  }

  function normalizeShipment(s) {
    // Handle both the legacy local store shape and the public API/Supabase shape.
    return {
      tracking: s.tracking_number || s.tracking || '—',
      item: s.item_description || s.package_description || s.item || '—',
      origin: s.origin || ((s.origin_city && s.origin_country) ? s.origin_city + ', ' + s.origin_country : (s.origin_city || '—')),
      destination: s.destination || ((s.destination_city && s.destination_country) ? s.destination_city + ', ' + s.destination_country : (s.destination_city || '—')),
      status: s.status || 'Pending',
      created: s.created_at || s.created || null,
      customer: s.customer_name || s.customer || null,
      email: s.customer_email || null,
      serviceType: s.service_type || s.shipping_method || s.serviceType || '—'
    };
  }

  function renderShipments(list) {
    const container = document.getElementById('shipmentsList');
    const note = document.getElementById('shipmentsNote');
    const sourceText = document.getElementById('shipmentsSourceText');
    const totalEl = document.getElementById('kpiTotal');
    const transitEl = document.getElementById('kpiTransit');
    const delEl = document.getElementById('kpiDelivered');
    const pendEl = document.getElementById('kpiPending');

    if (!list.length) {
      container.innerHTML = `<div class="cust-empty"><i class="fas fa-box-open"></i><p>No shipments found.</p><p style="font-size:12px;">When you create an import, it will appear here.</p></div>`;
      note.style.display = 'none';
      totalEl.textContent = '0'; transitEl.textContent = '0'; delEl.textContent = '0'; pendEl.textContent = '0';
      return;
    }

    const transit = list.filter(s => ['In Transit','in_transit','Shipped','shipped','Customs Clearance','customs_clearance','Out for Delivery','out_for_delivery'].includes(s.status)).length;
    const delivered = list.filter(s => ['Delivered','delivered'].includes(s.status)).length;
    const pending = list.length - transit - delivered;

    const heroTotal = document.getElementById('heroTotal');
    const heroTransit = document.getElementById('heroInTransit');
    const heroDelivered = document.getElementById('heroDelivered');
    totalEl.textContent = list.length;
    transitEl.textContent = transit;
    delEl.textContent = delivered;
    pendEl.textContent = pending;
    heroTotal.textContent = list.length;
    heroTransit.textContent = transit;
    heroDelivered.textContent = delivered;

    container.innerHTML = list.map(s => `
      <div class="cust-ship-item">
        <div class="cust-ship-icon"><i class="fas fa-ship"></i></div>
        <div class="cust-ship-body">
          <h5>${esc(s.item)} ${statusBadge(s.status)}</h5>
          <p><strong style="font-family:monospace;font-size:12px;color:var(--ag-blue-600);">${esc(s.tracking)}</strong> · ${esc(s.origin)} → ${esc(s.destination)}</p>
          <div class="cust-ship-meta"><span>${esc(s.serviceType)}</span><span>${timeAgo(s.created)}</span></div>
        </div>
        <div class="cust-ship-actions">
          <a class="btn" href="tracking.html?tracking=${encodeURIComponent(s.tracking)}"><i class="fas fa-map-marker-alt"></i> Track</a>
        </div>
      </div>`).join('');

    note.style.display = 'flex';
    sourceText.textContent = list._source || 'Supabase';
  }

  async function loadShipments(user, profile) {
    const sb = window.AsanAuth.client();
    let dbShipments = [];
    let source = 'Supabase (live)';

    try {
      // Query via RLS: customers see their own shipments (customer_id = auth.uid()).
      const { data, error } = await sb
        .from('shipments')
        .select('*')
        .order('created_at', { ascending: false });
      if (!error && Array.isArray(data) && data.length) {
        dbShipments = data;
      }
    } catch (e) {
      console.warn('[customer-dashboard] Supabase shipment query failed:', e);
    }

    // Merge with any legacy local shipments matching this customer's email.
    const legacy = [];
    try {
      const local = JSON.parse(localStorage.getItem('asan_imports') || '[]');
      const email = (user && user.email || '').toLowerCase();
      const name = (profile && profile.full_name) || '';
      local.forEach(s => {
        if ((s.email && s.email.toLowerCase() === email) || (s.customer && name && s.customer.toLowerCase() === name.toLowerCase())) {
          legacy.push(s);
        }
      });
    } catch (e) {}

    // Combine: DB shipments first, then legacy local ones not already present.
    const combined = dbShipments.map(normalizeShipment);
    const seen = new Set(combined.map(s => s.tracking));
    legacy.forEach(s => {
      const n = normalizeShipment(s);
      if (!seen.has(n.tracking)) { combined.push(n); seen.add(n.tracking); }
    });

    if (legacy.length) source += ' + local demo data';
    combined._source = source;
    renderShipments(combined);
  }

  function renderProfile(profile, user) {
    const body = document.getElementById('profileBody');
    const role = (profile && profile.role) || 'customer';
    body.innerHTML = `
      <div class="cust-profile-row"><span class="lbl">Full name</span><span class="val">${esc((profile && profile.full_name) || user.email || '—')}</span></div>
      <div class="cust-profile-row"><span class="lbl">Email</span><span class="val">${esc(user.email || '—')}</span></div>
      <div class="cust-profile-row"><span class="lbl">Role</span><span class="val">${esc(role)}</span></div>
      <div class="cust-profile-row"><span class="lbl">Phone</span><span class="val">${esc((profile && profile.phone) || '—')}</span></div>
      <div class="cust-profile-row"><span class="lbl">Company</span><span class="val">${esc((profile && profile.company) || '—')}</span></div>
      <div class="cust-profile-row"><span class="lbl">Country</span><span class="val">${esc((profile && profile.country) || '—')}</span></div>
      <div class="cust-profile-row"><span class="lbl">Member since</span><span class="val">${fmtDate((profile && profile.created_at) || user.created_at)}</span></div>`;
  }

  function logout() {
    window.AsanAuth.logout().then(() => { window.location.href = 'login.html'; });
  }
  window.logout = logout;

  async function init() {
    const auth = await window.AsanAuth.requireAuth('customer');
    if (!auth) return; // redirect handled
    const { user, profile } = auth;

    const name = (profile && profile.full_name) || user.email;
    const initial = (name || 'U').charAt(0).toUpperCase();
    document.getElementById('custName').textContent = name;
    document.getElementById('custAvatar').textContent = initial;
    document.getElementById('heroAvatar').textContent = initial;
    document.getElementById('heroName').textContent = 'Welcome, ' + name.split(' ')[0];
    document.getElementById('heroEmail').textContent = user.email;

    renderProfile(profile, user);
    await loadShipments(user, profile);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
